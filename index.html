<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tutus Score</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tutus Score">
<meta name="description" content="Sigue tus parlays en vivo: cada pierna se resuelve sola con datos de ESPN.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#0A0A0A}
body{margin:0}

/* Layout: app nativa de una columna — título grande por pestaña / contenido / tab bar translúcida; agregar y detalle en hojas */
/* Marca Tutus: fondos blancos, durazno para tarjetas, naranja solo para lo importante */
:root{
  --bg:#0A0A0A; --surface:#151515; --surface-2:#1E1E1E; --surface-3:#2B2B2B; --line:rgba(255,255,255,.08); --line-accent:rgba(255,61,0,.32);
  --fg:#F5F5F5; --muted:#A3A3A3; --faint:#737373; --accent:#FF3D00; --accent-hover:#E03400; --accent-ink:#FFFFFF; --accent-soft:rgba(255,61,0,.14);
  --win:#1FBF75; --loss:#F04438; --live:#FFB020;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --display:var(--font); --body:var(--font);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent;letter-spacing:-.005em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* Título grande por pestaña */
.top{flex:none;display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px 12px;padding-block:14px 12px}
.brandrow{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:38px;height:38px;display:block;flex:none}
.wm{font-size:24px;font-weight:800;letter-spacing:-.035em;color:var(--fg);line-height:1;margin-right:2px}
.prod{font-size:10.5px;font-weight:700;letter-spacing:.2em;color:var(--accent);background:var(--accent-soft);border:1.5px solid var(--line-accent);padding:5px 10px;border-radius:999px;white-space:nowrap}
.top h1{grid-column:1;margin:0;font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill .d{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.pill.live .d{background:var(--win);box-shadow:0 0 0 3px rgba(31,191,117,.2);animation:blink 2s infinite}
.pill.demo .d{background:var(--live)}
@keyframes blink{50%{opacity:.35}}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:28px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}

/* Logos y fotos (ESPN). Inicial de respaldo */
.tl{--s:28px;width:var(--s);height:var(--s);flex:none;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;position:relative;overflow:hidden}
.tl b{font-weight:700;font-size:calc(var(--s)*.32);color:var(--fg);letter-spacing:-.01em}
.tl img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:10%;background:#fff}
.av{--s:44px;width:var(--s);height:var(--s);flex:none;border-radius:50%;background:var(--surface-2);position:relative;display:grid;place-items:center;color:var(--muted)}
.av>b{font-weight:700;font-size:calc(var(--s)*.33)}
.av .ph{position:absolute;inset:0;border-radius:50%;overflow:hidden}
.av .ph img{width:100%;height:100%;object-fit:cover;object-position:top;background:var(--surface-2)}
.av>.tl{--s:18px;position:absolute;right:-2px;bottom:-2px;box-shadow:0 0 0 2.5px var(--surface)}
.duo{position:relative;width:44px;height:44px;flex:none;display:block}
.duo .tl{--s:30px;position:absolute}
.duo .tl:first-child{left:0;top:0} .duo .tl:last-child{right:0;bottom:0;box-shadow:0 0 0 2.5px var(--surface)}

/* Resumen */
.hero{padding:6px 2px 18px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:end}
.hero small{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.hero .big{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1.05;color:var(--fg)}
.hero .side{text-align:right;font-size:13px;color:var(--muted)}
.hero .side b{display:block;font-size:17px;font-weight:700;color:var(--fg)}
.counts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.counts span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:6px 10px;border-radius:999px}
.counts i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.sec{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:22px 2px 10px;display:flex;justify-content:space-between;align-items:center}

/* Parlay */
.pc{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.pc.dead{opacity:.6}
.pc-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;width:100%;padding:16px 16px 12px}
.pc-n{font-weight:700;font-size:16.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-m{font-size:13px;color:var(--muted)}
.pc-pay{text-align:right;grid-row:1/3;grid-column:2;align-self:center}
.pc-pay small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700}
.pc-pay b{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.pc.won .pc-pay b{color:var(--win)} .pc.dead .pc-pay b{color:var(--faint);text-decoration:line-through}
.segbar{display:flex;gap:4px;padding:0 16px}
.segbar i{flex:1;height:4px;border-radius:2px;background:var(--surface-3)}
.segbar i.live,.segbar i.even{background:var(--live)} .segbar i.won,.segbar i.winning{background:var(--win)} .segbar i.lost,.segbar i.losing{background:var(--loss)} .segbar i.push{background:var(--faint)}
.segbar i.winning,.segbar i.losing{opacity:.55}
.pc-st{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px 2px;font-size:12.5px;color:var(--muted);font-weight:500}
.tag{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.live{color:var(--live)} .tag.won{color:var(--win)} .tag.lost{color:var(--loss)}
.legs{padding:4px 8px 8px}

/* Pierna */
.leg{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:1px 12px;align-items:center;width:100%;padding:12px 8px;border-radius:16px;position:relative;transition:background .15s}
.leg+.leg::before{content:"";position:absolute;top:0;left:64px;right:8px;border-top:1px solid var(--line)}
.leg:hover{background:rgba(255,255,255,.03)}
.leg .ic{position:relative;width:44px;height:44px}
.leg .t{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.leg .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg .val{text-align:right;line-height:1;white-space:nowrap}
.leg .val b{font-size:23px;font-weight:800;letter-spacing:-.03em}
.leg .val span{font-size:14px;font-weight:600;color:var(--faint)}
.leg .trk{grid-column:2/4;position:relative;height:5px;border-radius:3px;background:var(--surface-3);margin-top:10px}
.leg .trk i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--live);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.leg .trk u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);border-radius:1px;opacity:.55}
.leg .ft{grid-column:2/4;display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-top:7px;min-width:0}
.leg .ft .msg{font-weight:700;white-space:nowrap}
.leg .ft .gm{color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:6px;min-width:0;font-weight:500}
.leg .ft .gm.lv::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--loss);animation:blink 1.4s infinite}
.st-live .msg,.st-even .msg{color:var(--live)}
.st-winning .msg,.st-winning .val b,.st-won .msg,.st-won .val b{color:var(--win)}
.st-losing .msg,.st-losing .val b,.st-lost .msg,.st-lost .val b{color:var(--loss)}
.st-push .msg,.st-pending .msg{color:var(--faint);font-weight:600}
.st-won .trk i{background:var(--win)} .st-lost .trk i{background:var(--loss)}
.ck{position:absolute;right:-3px;bottom:-3px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:900;color:#fff;box-shadow:0 0 0 2.5px var(--surface);z-index:2}
.st-won .ck{background:var(--win)} .st-lost .ck{background:var(--loss)}
.st-won .av>.tl,.st-lost .av>.tl{display:none}
.bump{display:inline-block;vertical-align:top;margin-right:6px;font-size:13px;font-weight:800;color:var(--win);background:var(--accent-soft);padding:3px 6px;border-radius:6px;animation:bump 3s ease-out forwards}
@keyframes bump{0%{opacity:0;transform:translateY(4px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.flash .val b{animation:flash 1.2s ease-out}
@keyframes flash{0%{color:var(--accent)}}

/* Terminados */
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;width:100%;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:8px}
.hrow .ic{grid-row:1/3;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.hrow .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .m{font-size:12.5px;color:var(--muted);grid-column:2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .v{grid-row:1/3;grid-column:3;font-weight:800;font-size:17px;text-align:right;letter-spacing:-.02em}
.hrow .v.pos{color:var(--win)} .hrow .v.neg{color:var(--muted)}

.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.kpi b{display:block;font-weight:800;font-size:21px;letter-spacing:-.03em;line-height:1.2;margin-top:4px;white-space:nowrap}
.kpi b.pos{color:var(--win)} .kpi b.neg{color:var(--loss)}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:2px 12px;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;transition:background .15s,color .15s}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--line-accent)}
.chip .n{font-size:11.5px;opacity:.7}

.game{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:8px}
.tm{display:flex;align-items:center;gap:11px;min-width:0}
.tm .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .rec{font-size:12px;color:var(--faint)}
.sc{font-size:20px;font-weight:800;text-align:right;line-height:1;letter-spacing:-.02em}
.sc.lose{color:var(--faint);font-weight:600}
.gmeta{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--faint);font-weight:500;padding-top:2px}
.gmeta .lv{color:var(--loss);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.gmeta .lv::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 1.4s infinite}
.gmeta .mine{color:var(--accent);font-weight:700}

.empty{text-align:center;color:var(--muted);padding:56px 20px}
.empty h3{font-size:21px;color:var(--fg);margin:0 0 8px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.empty p{margin:0 auto;max-width:32ch;line-height:1.5}
.skel{height:84px;border-radius:18px;background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:8px}
@keyframes sk{to{background-position:-200% 0}}

/* Botón agregar + tab bar */
.fab{justify-self:center;align-self:center;margin:-16px 4px 0;z-index:7;display:inline-flex;align-items:center;gap:6px;height:48px;padding:0 16px 0 12px;white-space:nowrap;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15px;box-shadow:0 10px 26px rgba(255,61,0,.28)}
.fab svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:stretch;margin-inline:-16px;padding-inline:16px;background:rgba(10,10,10,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);position:relative;z-index:6}
.tab{display:grid;grid-template-rows:30px auto;justify-items:center;align-items:center;gap:3px;padding:8px 0 8px;font-size:11px;white-space:nowrap;font-weight:600;color:var(--faint);position:relative}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.tab .bd{position:absolute;top:5px;left:calc(50% + 7px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center}

/* Hojas */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:92%;z-index:41;background:#101010;border:1px solid var(--line);border-bottom:0;border-top-left-radius:22px;border-top-right-radius:22px;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.2,1);box-shadow:0 30px 80px rgba(36,26,22,.25)}
.sheet.on{transform:none}
.sheet.tall{height:94%;max-height:94%}
.sh-h{flex:none;padding:8px max(18px, env(safe-area-inset-right, 0px)) 10px max(18px, env(safe-area-inset-left, 0px))}
.grab{width:36px;height:5px;border-radius:3px;background:var(--surface-3);margin:0 auto 12px}
.sh-top{display:flex;align-items:center;gap:10px}
.sh-title{font-size:21px;font-weight:800;letter-spacing:-.025em;line-height:1.15;min-width:0;flex:1}
.sh-sub{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--muted)}
.ib svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sh-b{flex:1;overflow-y:auto;padding:6px max(18px, env(safe-area-inset-right, 0px)) 20px max(18px, env(safe-area-inset-left, 0px))}
.sh-f{flex:none;padding:12px max(18px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));border-top:1px solid var(--line)}

.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:19px;height:19px;stroke:var(--faint);stroke-width:2;fill:none;stroke-linecap:round}
.search input{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 14px 14px 44px;font-size:16px;font-weight:500}
.search input::placeholder{color:var(--faint)}
.search input:focus{outline:none;border-color:var(--accent);background:var(--bg)}
.res{display:flex;flex-direction:column}
.ri{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:1px 12px;align-items:center;width:100%;padding:11px 6px;border-radius:14px}
.ri:hover{background:var(--surface)}
.ri .a{grid-row:1/3}
.ri .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri .m{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;grid-column:2}
.ri .r{grid-row:1/3;grid-column:3;font-size:12px;color:var(--faint);text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.ri .r.in{color:var(--loss)}
.hint{font-size:13px;color:var(--faint);padding:6px 4px}

.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 12px;margin-bottom:14px}
.score .side{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.score .side .tl{--s:50px}
.score .side span{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.score .mid{text-align:center}
.score .mid b{font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1}
.score .mid small{display:block;font-size:12.5px;color:var(--muted);margin-top:6px;font-weight:600}
.score .mid small.lv{color:var(--loss)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{padding:9px 4px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--muted);text-align:center;transition:background .15s}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--fg)}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
.pick{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;min-width:0;text-align:center;transition:border-color .15s,background .15s}
.pick span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick small{font-size:12.5px;color:var(--muted);font-weight:500}
.pick .tl{--s:44px}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pick[aria-pressed="true"] small{color:var(--accent);font-weight:700}
.flabel{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.inp{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;font-weight:500}
.inp::placeholder{color:var(--faint)}
.inp:focus{outline:none;border-color:var(--accent)}
.line{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;gap:8px;margin-bottom:16px}

.pv{display:flex;align-items:center;gap:14px;margin-bottom:16px}

.statline{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px;border-radius:12px;font-weight:700;font-size:15.5px;background:var(--surface);border:1.5px solid var(--line);text-align:center;transition:background .15s,border-color .15s}

.btn.line2{flex-direction:column;gap:2px} .btn.line2 small{font-size:12.5px;font-weight:600;color:var(--muted)} .btn.line2 b{font-size:22px;font-weight:800;letter-spacing:-.03em}
.btn.on{border-color:var(--line-accent);background:var(--accent-soft)} .btn.on small,.btn.on b{color:var(--accent)}

.tray{display:flex;align-items:center;gap:12px}

.tray .btn{padding:13px 22px;flex:none}

.rl{display:grid;grid-template-columns:44px minmax(0,1fr) 34px;gap:1px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}

.ticket{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin:16px 0}

.payout{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.payout span{color:var(--muted);font-size:14px;font-weight:600}
.payout b{font-weight:800;font-size:30px;color:var(--win);letter-spacing:-.04em}
.help{font-size:12.5px;color:var(--faint);margin-top:8px}

.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 16px;margin-bottom:12px}
.box .r{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:500}

.box .r.hl,.box .r.hl b{color:var(--accent);font-weight:700}
.note{font-size:14px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;line-height:1.5}
.note b{color:var(--fg)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}

.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top, 0px));transform:translate(-50%,-14px);background:var(--fg);color:var(--bg);font-weight:600;font-size:14px;padding:11px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.28s cubic-bezier(.2,.9,.2,1);z-index:60;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;box-shadow:0 10px 30px rgba(36,26,22,.25)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.upl{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:16px;background:var(--accent-soft);border:1.5px dashed var(--line-accent);margin-bottom:14px;text-align:left}
.upl .ico{width:42px;height:42px;border-radius:12px;background:var(--accent);display:grid;place-items:center;flex:none;box-shadow:0 10px 26px rgba(255,61,0,.28)}

.upl span span{font-size:13px;color:var(--muted)}
.scan{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 0 20px;text-align:center}
.scan .shot{position:relative;width:min(260px,70%);border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 80px rgba(36,26,22,.18)}
.scan .shot img{display:block;width:100%;max-height:46vh;object-fit:cover;object-position:top}
.scan .shot::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--accent);box-shadow:0 0 18px 4px rgba(255,61,0,.45);animation:scanline 1.8s ease-in-out infinite alternate;top:0}
@keyframes scanline{to{top:calc(100% - 3px)}}
.scan h3{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}

.found{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:6px;font-size:13.5px;color:var(--muted)}

.sw{flex:none;width:46px;height:28px;border-radius:999px;background:var(--surface-3);position:relative;transition:background .2s}

.tab .addpill{width:50px;height:30px;border-radius:999px;background:var(--accent);display:grid;place-items:center;box-shadow:0 6px 18px rgba(255,61,0,.35)}

.tab.add{color:var(--fg)}
/* Detalle de partido */
.star{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--surface-2);color:var(--faint)}

.star.on{color:#FFB020;background:rgba(255,176,32,.14)} .star.on svg{fill:currentColor}
.wp{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}

.ldr{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}

.tblw{overflow-x:auto;margin:0 -18px 14px;padding:0 18px;scrollbar-width:none}
.tblw::-webkit-scrollbar{display:none}
.tbl{border-collapse:separate;border-spacing:0;font-size:13px;font-variant-numeric:tabular-nums;min-width:100%}

.play{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:start}

.infobox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 14px;margin-bottom:12px}
.infobox .r{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.infobox .r:last-child{border-bottom:0} .infobox .r span{color:var(--muted)} .infobox .r b{text-align:right;font-weight:700}
/* Equipos */
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.tc-h{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px}

.mg{display:grid;grid-template-columns:62px minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;width:100%;padding:10px 14px;border-top:1px solid var(--line);font-size:13.5px}
.mg .when{font-size:11.5px;font-weight:700;color:var(--faint);line-height:1.2}

.res.W{background:rgba(31,191,117,.16);color:var(--win)} .res.L{background:rgba(240,68,56,.14);color:var(--loss)} .res.D{background:var(--surface-3);color:var(--muted)}
.tpick{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:10px 4px;border-bottom:1px solid var(--line)}

.game .fav{color:#FFB020;font-size:12px;margin-left:2px}
.top #hact{grid-column:2;justify-self:end;align-self:center}
.newbtn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px 0 12px;border-radius:999px;background:var(--accent);color:#fff;font-weight:800;font-size:14.5px;box-shadow:0 8px 22px rgba(255,61,0,.3)}

.newbtn.ghost{background:var(--surface-2);color:var(--fg);box-shadow:none}
.stick{position:sticky;top:0;z-index:4;background:var(--bg);margin-inline:-16px;padding:2px 16px 0}

/* Ficha de partido en pantalla completa */
.sheet.full{height:100%;max-height:100%;border-radius:0;border:0;top:0}

.follow.on{background:rgba(255,176,32,.15);color:#FFB020} .follow.on svg{fill:currentColor}
.ldr2{padding:12px 0;border-bottom:1px solid var(--line)}

.inst{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line-accent);border-radius:16px;padding:12px 12px 12px 14px;margin-bottom:12px}

.inst .ib{width:30px;height:30px}
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.ncard .row{display:flex;align-items:center;gap:12px}
.ncard .row div{flex:1;min-width:0} .ncard b{display:block;font-size:15px;font-weight:800} .ncard .row span{font-size:12.5px;color:var(--muted)}
.ncard .chips{margin:12px -14px 0;padding-inline:14px;padding-bottom:0;flex-wrap:wrap}

.lgr{display:flex;align-items:center;gap:10px;padding:0 12px 0 0;border-top:1px solid var(--line)}

.lvdot{width:6px;height:6px;border-radius:50%;background:var(--loss);display:inline-block;animation:blink 1.4s infinite}
.tl.lgl{background:var(--surface-3)} .tl.lgl img{background:#fff;padding:14%}

.seclink{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;background:none;border:0;padding:0;cursor:pointer}

.wknav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}

.dayh{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:capitalize;color:var(--muted);margin:14px 2px 8px}

.pc.mine{border-color:var(--line-accent)}

.form{display:flex;align-items:center;gap:5px;margin-bottom:12px;flex-wrap:wrap}

<script>

const BASES=['https://site.api.espn.com/apis/site/v2/sports/'];

const LEAGUES=[

  SOC('seriea','Serie A','ita.1',null,1),
  SOC('bundes','Bundesliga','ger.1',null,1),
  SOC('ligue1','Ligue 1','fra.1',null,1),
  SOC('ered','Eredivisie','ned.1',null,0),

  SOC('arg','Liga Argentina','arg.1','Argentina',0),
  SOC('bra','Brasileirão','bra.1',null,0),
  {id:'nfl',name:'NFL',sport:'football',league:'nfl',kind:'football',hs:'nfl',web:'nfl/game/_/gameId/',pro:1},
  {id:'nba',name:'NBA',sport:'basketball',league:'nba',kind:'basketball',hs:'nba',web:'nba/game/_/gameId/',pro:1},
  {id:'mlb',name:'MLB',sport:'baseball',league:'mlb',kind:'baseball',hs:'mlb',web:'mlb/game/_/gameId/',pro:1},
  {id:'nhl',name:'NHL',sport:'hockey',league:'nhl',kind:'hockey',hs:'nhl',web:'nhl/game/_/gameId/',pro:1},

  {id:'ncaab',name:'NCAA Basketball',short:'NCAA BB',sport:'basketball',league:'mens-college-basketball',kind:'basketball',hs:'mens-college-basketball',web:'mens-college-basketball/game/_/gameId/'},
  {id:'wnba',name:'WNBA',sport:'basketball',league:'wnba',kind:'basketball',hs:'wnba',web:'wnba/game/_/gameId/',pro:1},
];
// Orden por lo que más se ve en México (las favoritas del usuario siempre van antes)
const POP=['nfl','ucl','ligamx','epl','laliga','nba','mlb','uel','mls','concachamp','seriea','bundes','ligue1','lib','nhl','cfb','uecl','port','ered','champ','arg','bra','tur','sco','ncaab','wnba'];
LEAGUES.sort((a,b)=>{const i=POP.indexOf(a.id),j=POP.indexOf(b.id);return (i<0?99:i)-(j<0?99:j)});
const LG=Object.fromEntries(LEAGUES.map(l=>[l.id,l]));

/* ================= Props: [clave, etiqueta, llaves ESPN | fn, línea default, corto] ================= */
const sumK=(s,ks)=>{let t=0,any=false;ks.forEach(k=>{const v=pick(s,[k]);if(v!=null){t+=v;any=true}});return any?t:null};
const PROPS={
  basketball:[['pts','Puntos',['PTS'],24.5,'pts'],['reb','Rebotes',['REB'],6.5,'reb'],['ast','Asistencias',['AST'],5.5,'ast'],['3pm','Triples',['3PT'],2.5,'3pt'],
    ['pra','Pts+Reb+Ast',s=>sumK(s,['PTS','REB','AST']),34.5,'pra'],['pr','Pts+Reb',s=>sumK(s,['PTS','REB']),29.5,'p+r'],['pa','Pts+Ast',s=>sumK(s,['PTS','AST']),29.5,'p+a'],
    ['ra','Reb+Ast',s=>sumK(s,['REB','AST']),10.5,'r+a'],['stl','Robos',['STL'],0.5,'rob'],['blk','Tapones',['BLK'],0.5,'tap']],
  football:[['pyds','Yardas por pase',['passing.YDS'],229.5,'yds pase'],['ptd','TD por pase',['passing.TD'],1.5,'td pase'],['int','Intercepciones lanzadas',['passing.INT'],0.5,'int'],
    ['ryds','Yardas por tierra',['rushing.YDS'],59.5,'yds tierra'],['rec','Recepciones',['receiving.REC'],4.5,'rec'],['recyds','Yardas por recepción',['receiving.YDS'],49.5,'yds rec'],
    ['rryds','Yardas tierra+rec',s=>sumK(s,['rushing.YDS','receiving.YDS']),74.5,'yds tot'],['td','Anota TD',s=>sumK(s,['rushing.TD','receiving.TD']),0.5,'td']],
  baseball:[['h','Hits',['batting.H'],0.5,'h'],['hr','Jonrón',['batting.HR'],0.5,'hr'],['rbi','Carreras impulsadas',['batting.RBI'],0.5,'ci'],['r','Carreras anotadas',['batting.R'],0.5,'c'],
    ['hrr','Hits+Carr+CI',s=>sumK(s,['batting.H','batting.R','batting.RBI']),1.5,'h+c+ci'],['k','Ponches (pitcher)',['pitching.K'],5.5,'k'],['bb','Bases por bola',['batting.BB'],0.5,'bb']],
  hockey:[['g','Gol',['G'],0.5,'g'],['a','Asistencias',['A'],0.5,'a'],['p','Puntos',s=>sumK(s,['G','A']),0.5,'pts'],['sog','Tiros a gol',['SOG','S'],2.5,'tiros'],['sv','Atajadas',['SV'],26.5,'ataj']],
  soccer:[['g','Anota gol',['totalGoals'],0.5,'gol'],['a','Asistencia',['goalAssists'],0.5,'ast'],['sh','Tiros',['totalShots'],1.5,'tiros'],['sot','Tiros a puerta',['shotsOnTarget'],0.5,'a puerta']],
};
const EARLY={soccer:2,basketball:20,football:17,baseball:5,hockey:3};
const YESNO=new Set(['td','g','hr']);
const propDef=(kind,k)=>(PROPS[kind]||[]).find(p=>p[0]===k);
function pick(s,keys){for(const k of keys){if(s&&s[k]!=null)return s[k]}return null}
function propValue(kind,k,s){const d=propDef(kind,k);if(!d||!s)return null;return typeof d[2]==='function'?d[2](s):pick(s,d[2])}

/* ================= Utilidades ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>n==null||!isFinite(n)?'—':'$'+Math.round(n).toLocaleString('es-MX');
const moneyK=n=>n==null||!isFinite(n)?'—':Math.abs(n)>=100000?'$'+(n/1000).toLocaleString('es-MX',{maximumFractionDigits:0})+'k':money(n);
const signed=n=>n>0?'+'+n:String(n);
const fmtNum=n=>n==null?'—':String(Math.round(n*10)/10);
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const initials=n=>String(n||'?').split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const uid=()=>Math.random().toString(36).slice(2,10);
function dec(x){x=Number(String(x??'').replace(',','.').trim());if(!x||!isFinite(x))return null;if(Math.abs(x)>=100)return x>0?1+x/100:1+100/-x;if(x>1)return x;return null}
function toAm(d){if(!d||d<=1)return'—';return d>=2?'+'+Math.round((d-1)*100):String(Math.round(-100/(d-1)))}
function ymd(off){const d=new Date();d.setDate(d.getDate()+off);return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')}
const hhmm=iso=>{try{return new Date(iso).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',hour12:false})}catch(e){return''}};
const dayLabel=off=>{if(off===0)return'Hoy';if(off===-1)return'Ayer';if(off===1)return'Mañana';const d=new Date();d.setDate(d.getDate()+off);return d.toLocaleDateString('es-MX',{weekday:'short',day:'numeric'}).replace('.','')};
function whenLabel(iso){const d=new Date(iso),t=new Date();const diff=Math.round((new Date(d.toDateString())-new Date(t.toDateString()))/864e5);
  return (diff===0?'hoy':diff===1?'mañana':diff===-1?'ayer':d.toLocaleDateString('es-MX',{weekday:'short',day:'numeric'}).replace('.',''))+' '+hhmm(iso)}
function store(k,v){try{if(v===undefined){const r=localStorage.getItem(k);return r?JSON.parse(r):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function parseStat(v){if(v==null)return null;const m=String(v).match(/-?\d+(\.\d+)?/);return m?Number(m[0]):null}
const TR=[[/Halftime/i,'Medio tiempo'],[/^Final\/OT/i,'Final (TE)'],[/^Final/i,'Final'],[/^FT$/i,'Final'],[/^HT$/i,'Medio tiempo'],[/End of (\d)\w*/i,'Fin $1º'],[/(\d)(st|nd|rd|th) Qtr/i,'Q$1'],[/(\d)(st|nd|rd|th) Period/i,'P$1'],[/(\d)(st|nd|rd|th)/i,'$1º'],[/Top/i,'Alta'],[/Bot/i,'Baja'],[/Mid/i,'Mitad'],[/Postponed/i,'Pospuesto'],[/Delayed/i,'Retrasado'],[/Canceled/i,'Cancelado']];
const tr=s=>{s=String(s||'');TR.forEach(([a,b])=>s=s.replace(a,b));return s};
const IC={
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  cam:'<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  back:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  grip:'<svg viewBox="0 0 24 24"><path d="M5 8h14M5 12h14M5 16h14"/></svg>',
  grid:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>',
  live:'<svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>',
  games:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4M8 14h3M8 17h6"/></svg>',
  leagues:'<svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M16 6h3a3 3 0 0 1-3 4M8 6H5a3 3 0 0 0 3 4M12 13v4M8 20h8M10 17h4"/></svg>',
  teams:'<svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  hist:'<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>',
};

/* Logos y fotos: solo se piden cuando hay conexión real a ESPN */
const showImg=()=>S.mode==='live';
function logo(t,size){if(!t)return'';return `<span class="tl" style="--c:${esc(t.color||'#5a6577')};--c2:${esc(t.alt||t.color||'#5a6577')};${size?`--s:${size}px`:''}"><b>${esc(t.abbr||'')}</b>${showImg()&&t.logo&&!BADIMG.has(t.logo)?`<img src="${esc(darkLogo(t.logo))}"${darkLogo(t.logo)!==t.logo?` data-fb="${esc(t.logo)}"`:''} alt="" loading="lazy">`:''}</span>`}
const BADIMG=new Set();
const darkLogo=u=>BADIMG.has(String(u||'').replace('/500/','/500-dark/'))?u:/espncdn\.com\/i\/(team|league)logos\//.test(u||'')&&!/500-dark/.test(u)?u.replace('/500/','/500-dark/'):u;
function headUrl(lg,id){const L=LG[lg];return L&&id?`https://a.espncdn.com/i/headshots/${L.hs}/players/full/${id}.png`:''}
function avatar(name,head,team,size){const soc=!!(showImg()&&name&&/\/soccer\//.test(head||''));const f=soc?TS[name]:null;
  return `<span class="av"${soc?` data-ts="${esc(name)}" data-tt="${esc(team&&team.name||'')}" data-eh="${esc(head)}"${f?' data-fd="1"':''}`:''} style="${size?`--s:${size}px;`:''}${team&&team.color?`--c:${esc(team.color)};--c2:${esc(team.alt||team.color)}`:''}"><b>${esc(initials(name))}</b>${soc?(f?`<span class="ph"><img class="cut" src="${esc(f)}" alt="" loading="lazy"></span>`:''):(showImg()&&head&&!BADIMG.has(head)?`<span class="ph"><img src="${esc(head)}" alt="" loading="lazy"></span>`:'')}${team?logo(team):''}</span>`}
/* Fotos de futbolistas: recortes uniformes de TheSportsDB (gratis), en fila y guardados en el teléfono */
const TSK='pt_ts2';const TS=(()=>{try{return JSON.parse(localStorage.getItem(TSK)||'{}')}catch(e){return {}}})();const TSP={};const TSQ=[];let tsRun=false;
const TSN=(()=>{try{return JSON.parse(localStorage.getItem('pt_tsn1')||'{}')}catch(e){return {}}})();const TST=(()=>{try{return JSON.parse(localStorage.getItem('pt_tst1')||'{}')}catch(e){return {}}})();
const nkey=n=>norm(n).replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim();
async function tsTeam(team){const k=nkey(team);if(!k||TST[k])return;TST[k]=1;
  try{const r=await fetch('https://www.thesportsdb.com/api/v1/json/123/searchteams.php?t='+encodeURIComponent(team));if(!r.ok)throw 0;const j=await r.json();const tm=(j.teams||[]).find(x=>x.strSport==='Soccer');
    if(tm){await sleep(2100);const r2=await fetch('https://www.thesportsdb.com/api/v1/json/123/lookup_all_players.php?id='+tm.idTeam);if(r2.ok){const j2=await r2.json();(j2.player||[]).forEach(pl=>{const u=pl.strCutout||pl.strThumb;if(u)TSN[nkey(pl.strPlayer)]=u})}}
    try{localStorage.setItem('pt_tsn1',JSON.stringify(TSN));localStorage.setItem('pt_tst1',JSON.stringify(TST))}catch(e){}}catch(e){delete TST[k]}await sleep(2100)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function tsFace(name,team){if(name in TS)return Promise.resolve(TS[name]);if(TSN[nkey(name)]){TS[name]=TSN[nkey(name)];return Promise.resolve(TS[name])}if(TSP[name])return TSP[name].p;let res;const p=new Promise(r=>res=r);TSP[name]={p,res,team,n:0};TSQ.push(name);pumpTS();return p}
async function pumpTS(){if(tsRun)return;tsRun=true;try{while(TSQ.length){const name=TSQ.pop();const q=TSP[name];if(!q)continue;let u=null;
  if(q.team&&!TST[nkey(q.team)])await tsTeam(q.team);if(TSN[nkey(name)]){TS[name]=TSN[nkey(name)]+(/\/small$/.test(TSN[nkey(name)])?'':'/small');delete TSP[name];q.res(TS[name]);continue}
  const tw=norm(q.team||'').split(' ').filter(w=>w.length>2);const words=name.split(' ');
  const vs=[...new Set([name,name.normalize('NFD').replace(/[̀-ͯ]/g,''),words.length>2?words[0]+' '+words[words.length-1]:''].filter(Boolean))];
  for(const qn of vs){let got=null;try{const r=await fetch('https://www.thesportsdb.com/api/v1/json/123/searchplayers.php?p='+encodeURIComponent(qn));if(r.ok){const j=await r.json();const ps=(j.player||[]).filter(x=>x.strSport==='Soccer');
      const pl=ps.find(x=>tw.some(w=>norm(x.strTeam||'').includes(w)))||(qn===name?ps[0]:null);got=pl?(pl.strCutout||pl.strThumb||''):''}}catch(e){}
    if(got===null){u=null;break}u=got;if(got)break;await sleep(2100)}
  if(u===null&&++q.n<4){TSQ.unshift(name);await sleep(12000);continue}
  TS[name]=u&&/r2\.thesportsdb\.com/.test(u)&&!/\/small$/.test(u)?u+'/small':(u||'');try{localStorage.setItem(TSK,JSON.stringify(TS))}catch(e){}delete TSP[name];q.res(u||'');await sleep(2100)}}finally{tsRun=false}}
/* Fotos ya listas: photos.json lo llena el robot del repo; con esto salen al instante */
let PH={};
const phUrl=c=>!c?'':c[0]==='c'?`https://r2.thesportsdb.com/images/media/player/cutout/${c.slice(1)}.png/small`:c[0]==='t'?`https://r2.thesportsdb.com/images/media/player/thumb/${c.slice(1)}.jpg/small`:c[0]==='p'?`https://r2.thesportsdb.com/images/media/player/thumb/${c.slice(1)}.png/small`:c.slice(1);
const ehId=el=>((el.dataset.eh||'').match(/\/soccer\/players\/full\/(\d+)\.png/)||[])[1];
function applyPH(){document.querySelectorAll('[data-ts]:not([data-fd])').forEach(el=>{const id=ehId(el);if(id&&PH[id])putFace(el,phUrl(PH[id]))})}
try{const c=JSON.parse(localStorage.getItem('pt_ph')||'null');if(c&&c.p)PH=c.p}catch(e){}
Promise.all(['photos.json'].concat([0,1,2,3,4,5,6,7].map(i=>`photos-${i}.json`)).map(f=>fetch(f,{cache:'no-cache'}).then(r=>r.ok?r.json():null).catch(()=>null))).then(js=>{const m={};js.forEach(j=>{if(j&&j.p)Object.entries(j.p).forEach(([k,v])=>{if(v||!(k in m))m[k]=v})});if(Object.keys(m).length){PH=m;try{localStorage.setItem('pt_ph',JSON.stringify({p:PH}))}catch(e){}applyPH()}});
function putFace(el,u){if(el.dataset.fd)return;el.dataset.fd='1';if(el.classList.contains('av')){const sp=document.createElement('span');sp.className='ph';sp.innerHTML=`<img class="cut" src="${esc(u)}" alt="">`;el.insertBefore(sp,el.querySelector('.tl'))}else{el.classList.add('hasf');el.insertAdjacentHTML('afterbegin',`<img class="cut" src="${esc(u)}" alt="">`)}}
function applyFace(name,u){if(!u){document.querySelectorAll('[data-ts]').forEach(el=>{if(el.dataset.ts===name&&el.dataset.eh)putFace(el,el.dataset.eh)});return}document.querySelectorAll('[data-ts]').forEach(el=>{if(el.dataset.ts===name)putFace(el,u)})}
const faceIO='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){faceIO.unobserve(e.target);const n=e.target.dataset.ts;tsFace(n,e.target.dataset.tt).then(u=>applyFace(n,u))}}),{rootMargin:'150px'}):null;
function hydrateFaces(){document.querySelectorAll('[data-ts]:not([data-fd]):not([data-ob])').forEach(el=>{const n=el.dataset.ts;const pid=ehId(el);if(pid&&PH[pid]){putFace(el,phUrl(PH[pid]));return}if(pid&&pid in PH&&!(n in TS)){el.dataset.ob='1';if(el.dataset.eh)putFace(el,el.dataset.eh);return}if(n in TS){el.dataset.ob='1';if(TS[n])putFace(el,TS[n]);else if(el.dataset.eh)putFace(el,el.dataset.eh);return}el.dataset.ob='1';if(faceIO)faceIO.observe(el);else tsFace(n,el.dataset.tt).then(u=>applyFace(n,u))})}
let hyT;new MutationObserver(()=>{clearTimeout(hyT);hyT=setTimeout(hydrateFaces,80)}).observe(document.body,{childList:true,subtree:true});
document.addEventListener('error',e=>{const t=e.target;if(t&&t.tagName==='IMG'){BADIMG.add(t.getAttribute('src'));if(t.dataset.fb){const fb=t.dataset.fb;delete t.dataset.fb;t.src=fb;return}if(t.dataset.nm&&!t.dataset.wk){t.dataset.wk='1';wikiFace(t.dataset.nm).then(u=>{if(u){t.addEventListener('load',()=>{t.style.opacity=1},{once:true});t.src=u}else{const ph=t.closest('.ph');(ph||t).remove()}});return}const hf=t.closest('.hasf');if(hf)hf.classList.remove('hasf');const ph=t.closest('.ph');(ph||t).remove()}},true);

/* ================= Datos ================= */
const api={
  async get(path){if(S.mode==='demo')return MOCK.route(path);const r=await fetch(BASE+path,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()},
  scoreboard(lg,date){const L=LG[lg];return this.get(`${L.sport}/${L.league}/scoreboard?dates=${date}&limit=300`)},
  summary(lg,id){const L=LG[lg];return this.get(`${L.sport}/${L.league}/summary?event=${id}`)},

    if(L.side==='draw'){const d=g.home.score-g.away.score;r.status=fin?(d===0?'won':'lost'):(d===0?'winning':'losing');r.v=`${g.away.score}-${g.home.score}`;r.msg=d===0?(fin?'Quedó empate':'Van empatados'):(fin?'No hubo empate':'No hay empate')}

      r.msg=fin?(d>0?`Ganó por ${d}`:d<0?`Perdió por ${-d}`:'Empate'):(d>0?`Gana por ${d}`:d<0?`Pierde por ${-d}`:'Van empatados');

function morph(a,b){
  if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b);return}
  if(a.nodeType!==1){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}

  for(const at of [...b.attributes]){if(a.getAttribute(at.name)!==at.value){if(a.tagName==='INPUT'&&at.name==='value')continue;a.setAttribute(at.name,at.value)}}
  for(const at of [...a.attributes]){if(!b.hasAttribute(at.name)&&!/^data-(fd|ob|wk)$/.test(at.name))a.removeAttribute(at.name)}
  if(a.tagName==='INPUT'||a.tagName==='TEXTAREA'){if(document.activeElement!==a&&a.value!==b.value)a.value=b.value;return}
  if(a.tagName==='svg'||a.tagName==='SVG'){if(a.innerHTML!==b.innerHTML)a.innerHTML=b.innerHTML;return}
  morphKids(a,b)}
