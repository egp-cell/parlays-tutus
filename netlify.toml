# Servidor de avisos de Tutus Score (Netlify, gratis).
# La app sigue viviendo en GitHub Pages; aquí solo corren las funciones de avisos.
[build]
  publish = "."
  command = "echo listo"
  # Solo despliega si cambió el servidor de avisos (las fotos y la app no gastan créditos)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- netlify/functions netlify.toml package.json"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
