name: Probar fuentes de fotos
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/probe.mjs'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/probe.mjs
