name: Fotos de jugadores
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/photos.mjs'
      - '.github/workflows/photos.yml'
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    concurrency:
      group: photos-${{ matrix.shard }}
      cancel-in-progress: true
    env:
      SHARD: ${{ matrix.shard }}
      SHARDS: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: git config user.name "tutus-bot" && git config user.email "tutus-bot@users.noreply.github.com"
      - run: node tools/photos.mjs
